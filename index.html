<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Filter benign Vite HMR websocket messages and errors in sandboxed preview iframe
      (function() {
        function isViteMessage(msg) {
          if (!msg) return false;
          var str = typeof msg === 'string' ? msg : (msg.message || msg.reason || String(msg));
          return str.indexOf('[vite]') !== -1 || str.indexOf('vite:') !== -1 || str.indexOf('WebSocket closed without opened') !== -1;
        }

        var origError = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteMessage(arguments[i])) return;
          }
          origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isViteMessage(arguments[i])) return;
          }
          origWarn.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          if (isViteMessage(e.message) || isViteMessage(e.error)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isViteMessage(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
