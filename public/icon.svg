<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded square with safe padding -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Cyber Arena Energy Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="16 12"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#818cf8" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Center Mech / Transformer Crest Shield -->
  <g filter="url(#glow)">
    <!-- Main Outer Crest -->
    <path d="M256 80 L380 150 L350 320 L256 420 L162 320 L132 150 Z" 
          fill="#090d16" 
          stroke="url(#crestGrad)" 
          stroke-width="12" 
          stroke-linejoin="round"/>
    
    <!-- Inner Cybertron Core -->
    <path d="M256 120 L340 170 L320 290 L256 360 L192 290 L172 170 Z" 
          fill="url(#crestGrad)" 
          opacity="0.9"/>
          
    <!-- Core Energy Crystal -->
    <polygon points="256,170 300,240 256,310 212,240" fill="url(#amberGrad)"/>
    
    <!-- Eyes / Optical Scanners -->
    <rect x="220" y="215" width="22" height="8" rx="3" fill="#ffffff"/>
    <rect x="270" y="215" width="22" height="8" rx="3" fill="#ffffff"/>
    
    <!-- Glowing Cross Lines -->
    <line x1="256" y1="130" x2="256" y2="350" stroke="#ffffff" stroke-width="4" opacity="0.6"/>
  </g>
</svg>
